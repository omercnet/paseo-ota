name: Sync upstream tags

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Paseo tag to import; empty selects the newest stable tag
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-tags
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Configure downstream commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync stable upstream tag
        env:
          UPSTREAM_REPOSITORY: https://github.com/getpaseo/paseo.git
          REQUESTED_TAG: ${{ inputs.tag }}
        run: node scripts/sync-upstream-tag.mjs "$REQUESTED_TAG"

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          ONNXRUNTIME_NODE_INSTALL: skip
        run: node scripts/npm-retry.mjs ci

      - name: Verify OTA overlay
        env:
          APP_VARIANT: ota
          XPREM_URL: https://updates.invalid
          XPREM_APP_ID: paseo-ota
        run: |
          npm run build:app-deps
          npm run ota:config
          npm run lint
          npm run typecheck

      - name: Open synchronization pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet origin/main...HEAD; then
            exit 0
          fi
          tag="$(git describe --tags --abbrev=0 HEAD)"
          branch="automation/upstream-${tag}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin "HEAD:$branch"
          gh pr create --base main --head "$branch" --title "chore(ota): sync upstream $tag" --body "Rebases the OTA variant on upstream Paseo $tag. Native and OTA publication remain manual." || true
